# ===========================================
# AI Optimizer Production Docker Compose
# ===========================================

services:
  ai-optimizer:
    image: ghcr.io/carrickcheah/ai-optimizer:latest
    container_name: ai-optimizer
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      - PYTHONUNBUFFERED=1
      - MARIADB_HOST=${MARIADB_HOST:-172.17.0.1}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_USERNAME=${MARIADB_USERNAME:-nex_docker}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-nex_valiant}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ai-optimizer-network

networks:
  ai-optimizer-network:
    driver: bridge
