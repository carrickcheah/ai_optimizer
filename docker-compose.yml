version: '3.8'

services:
  ai-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"      # Frontend (nginx)
      - "8000:8000"  # Backend API (optional direct access)
    environment:
      - PYTHONPATH=/app/backend
      - ENV=production
    volumes:
      # Persist logs
      - ./logs:/app/logs
      - ./nginx-logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

