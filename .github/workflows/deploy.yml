# ===========================================
# AI Optimizer CI/CD Pipeline
# Build, push to GHCR, and deploy to server
# ===========================================

name: Deploy AI Optimizer

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-optimizer

jobs:
  # ===========================================
  # Job 1: Build and Push Docker Image
  # ===========================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Job 2: Deploy to Server
  # ===========================================
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 194.233.83.157 >> ~/.ssh/known_hosts

      - name: Create deployment directory on server
        run: |
          ssh -i ~/.ssh/deploy_key root@194.233.83.157 "mkdir -p /opt/ai-optimizer"

      - name: Copy docker-compose to server
        run: |
          scp -i ~/.ssh/deploy_key ./docker/docker-compose.prod.yml root@194.233.83.157:/opt/ai-optimizer/docker-compose.yml

      - name: Create .env file on server
        run: |
          ssh -i ~/.ssh/deploy_key root@194.233.83.157 "cat > /opt/ai-optimizer/.env << 'EOF'
          MARIADB_HOST=172.17.0.1
          MARIADB_PORT=3306
          MARIADB_USERNAME=nex_docker
          MARIADB_PASSWORD=${{ secrets.DB_PASSWORD }}
          MARIADB_DATABASE=nex_valiant
          NORMAL_WORKING_HOURS=17.5
          OT_WORKING_HOURS=19.5
          EMERGENCY_OT_HOURS=22.0
          MAX_JOBS_LIMIT=1000
          PLANNING_HORIZON_DAYS=180
          MAX_PLANNING_HORIZON_DAYS=240
          EOF"

      - name: Login to GHCR on server
        run: |
          ssh -i ~/.ssh/deploy_key root@194.233.83.157 "echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"

      - name: Pull and deploy container
        run: |
          ssh -i ~/.ssh/deploy_key root@194.233.83.157 "
            cd /opt/ai-optimizer && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f
          "

      - name: Verify deployment
        run: |
          sleep 15
          ssh -i ~/.ssh/deploy_key root@194.233.83.157 "
            echo '=== Container Status ===' && \
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep ai-optimizer && \
            echo '' && \
            echo '=== Health Check ===' && \
            curl -sf http://localhost:5000/health && echo ' - AI Optimizer OK' || echo 'Health check failed'
          "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
